{% load static %}
<div class="form-card htmx-fade-in" style="padding: 0;">
    <div style="padding: 1.5rem 2rem; border-bottom: 1px solid #f1f5f9;">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin: 0;">Payment Details</h2>
    </div>
    
    <div style="padding: 1.5rem 2rem;">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a;">Saved Cards</h3>
        
        <!-- Saved Cards Row -->
        <div class="saved-cards-row">
            <!-- Visa Card -->
            <div class="credit-card-ui card-blue">
                <div class="cc-header">
                    <div class="cc-logo">
                        <span style="font-style: italic; font-weight: 800; font-size: 1.2rem;">VISA</span>
                    </div>
                    <button class="cc-menu-btn"><i class="ph-bold ph-dots-three-vertical"></i></button>
                </div>
                <div class="cc-number">**** **** **** 1569</div>
                <div class="cc-footer">
                    <span>Valid thru: 12/26</span>
                    <span>CVV: ***</span>
                </div>
            </div>
            
            <!-- Mastercard -->
            <div class="credit-card-ui card-red">
                <div class="cc-header">
                    <div class="cc-logo" style="display: flex; align-items: center;">
                        <div style="width: 20px; height: 20px; background: #ea001b; border-radius: 50%; opacity: 0.8; margin-right: -8px; z-index: 2;"></div>
                        <div style="width: 20px; height: 20px; background: #f79e1b; border-radius: 50%; opacity: 0.8; z-index: 1;"></div>
                        <span style="font-size: 0.5rem; margin-left: 4px; font-weight: 600;">mastercard</span>
                    </div>
                    <button class="cc-menu-btn"><i class="ph-bold ph-dots-three-vertical"></i></button>
                </div>
                <div class="cc-number">**** **** **** 5620</div>
                <div class="cc-footer">
                    <span>Valid thru: 02/35</span>
                    <span>CVV: ***</span>
                </div>
            </div>
        </div>

        <!-- Add New Card Form -->
        <div class="add-card-container" style="margin-top: 2rem;">
            <div class="add-card-header">
                <h3>Add New Card</h3>
            </div>
            <div class="add-card-body">
                <form class="dashboard-form" onsubmit="event.preventDefault(); alert('Card tokenized and saved securely in VIP vault.');">
                    <div class="form-group">
                        <label>Card Number<span class="req">*</span></label>
                        <div class="cc-input-wrapper">
                            <input type="text" placeholder="xxxx xxxx xxxx xxxx" required>
                            <span class="cc-input-icon"><i class="ph-fill ph-credit-card text-blue"></i></span>
                        </div>
                    </div>
                    
                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Expiration Date<span class="req">*</span></label>
                            <div class="cc-expiry-inputs">
                                <input type="text" placeholder="Month (MM)" required>
                                <input type="text" placeholder="Year (YY)" style="border-left: none;" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>CVV / CVC<span class="req">*</span></label>
                            <input type="password" placeholder="xxx" maxlength="4" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Name on Card<span class="req">*</span></label>
                        <input type="text" placeholder="Enter full name on card" required>
                    </div>
                    
                    <button type="submit" class="btn btn-purple" style="background: #4F46E5; color: white; border: none; padding: 0.65rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;">Save VIP Card</button>
                </form>
            </div>
        </div>

    </div>
</div>

<!-- OOB Sidebar Swap for Active Tab Sync -->
<div id="customerSidebarNav" hx-swap-oob="outerHTML">
    {% include 'accounts/partials/sidebar_nav_partial.html' with active_tab='payment' %}
</div>
