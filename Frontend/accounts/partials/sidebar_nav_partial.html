        <a href="{% url 'accounts:dashboard' %}"

           hx-target="#dashboardMainContent" 
           hx-swap="innerHTML transition:true" 
           hx-push-url="true"
           hx-indicator="#htmx-indicator"
           class="{% if active_tab == 'dashboard' %}active{% endif %}">
            <i class="ph ph-user"></i> My Profile

    </li>
    <li>
